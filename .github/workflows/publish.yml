name: Render and Deploy

on:
  push:
    branches: [main]
  schedule:
    # Lunes 6 AM UTC — captura publicaciones nuevas de EPH e IPC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install Quarto
        run: |
          wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.8.27/quarto-1.8.27-linux-amd64.deb
          sudo dpkg -i quarto-1.8.27-linux-amd64.deb
          rm quarto-1.8.27-linux-amd64.deb

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgdal-dev libpng-dev libproj-dev libudunits2-dev pandoc

      - name: Restore renv environment
        shell: Rscript {0}
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore()

      # Cache de microdatos EPH — se refresca cada lunes (= nueva semana ISO)
      - name: Get current week
        id: date
        run: echo "week=$(date +%V-%Y)" >> $GITHUB_OUTPUT

      - name: Cache EPH microdata
        uses: actions/cache@v4
        with:
          path: data/cache
          key: eph-cache-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: |
            eph-cache-${{ runner.os }}-

      # Pipeline 1: indicadores de mercado laboral (empleo, desempleo, informalidad)
      - name: Calculate labor market indicators
        shell: Rscript {0}
        run: source("R/calcular_indicadores.R")

      # Pipeline 2: hogares — descarga CBA/CBT e IPC, calcula pobreza y grupos
      - name: Calculate household poverty indicators
        shell: Rscript {0}
        run: source("R/calcular_hogares.R")

      # Pipeline 3: paneles de transición ocupacional
      # Se ejecuta solo en el schedule semanal o en disparos manuales.
      # El script verifica internamente si ya existe cache para el período nuevo:
      # si data/paneles/cache_panel_YYYY-YYYY.rds no existe, descarga EPH y calcula;
      # si ya existe, lo carga sin re-descargar nada.
      - name: Calculate occupational transition panels
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: Rscript {0}
        run: source("R/calcular_paneles.R")

      - name: Render Quarto site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
