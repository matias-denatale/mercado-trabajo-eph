project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

website:
  title: "Mercado de Trabajo — EPH"
  description: "Indicadores del mercado laboral argentino basados en la Encuesta Permanente de Hogares (INDEC)"
  site-url: "https://matias-denatale.github.io/mercado-trabajo-eph/"
  favicon: "logos y fotos/favicon_matias_de_natale.png"
  navbar:
    logo: "logos y fotos/favicon_matias_de_natale.png"
    title: "<img src=\"logos y fotos/logo_montserrat.svg\" alt=\"Mercado de Trabajo — EPH\">"
    left:
      - href: index.qmd
        text: Inicio
      - href: paneles.qmd
        text: Paneles
      - href: hogares.qmd
        text: Hogares
      - href: metodologia.qmd
        text: Metodología
      - href: sobre-mi.qmd
        text: Sobre mí
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/matías-de-natale-336745181
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:matias_denatale@hotmail.com
        aria-label: Email
      - icon: github
        href: https://github.com/matias-denatale/mercado-trabajo-eph
        aria-label: GitHub
  page-footer:
    left: "Elaboración propia en base a EPH-INDEC."
    right: "Actualizado trimestralmente vía GitHub Actions."

format:
  html:
    theme: [lux, styles.css]
    toc: true
    toc-depth: 2
    code-fold: true
    code-summary: "Ver código"
    fig-width: 9
    fig-height: 5.5
    fig-dpi: 150
    lang: es
    smooth-scroll: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
